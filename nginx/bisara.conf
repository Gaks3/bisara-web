# ==============================================================================
# Konfigurasi Nginx untuk Next.js 16 (Bisara) - Mode Production dengan SSL
# Lokasi file di VPS: /etc/nginx/sites-available/bisara.conf
# ==============================================================================

upstream nextjs_upstream {
    # Mengarah ke container Docker Next.js yang berjalan di port 3000 host
    server 127.0.0.1:3000;
    keepalive 64;
}

# 1. HTTP Server - Redirect otomatis seluruh lalu lintas ke HTTPS
server {
    listen 80;
    listen [::]:80;

    # Ganti dengan domain Anda
    server_name bisara.web.id www.bisara.web.id;

    # Endpoint untuk verifikasi pembaruan sertifikat Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect permanen HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Reverse Proxy ke Next.js Standalone Container
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Ganti dengan domain Anda
    server_name bisara.web.id www.bisara.web.id;

    # Path Sertifikat SSL dari Let's Encrypt (Certbot)
    ssl_certificate /etc/letsencrypt/live/bisara.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bisara.web.id/privkey.pem;

    # Protokol & Cipher Modern (A+ SSL Labs rating)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Kompresi Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;

    # Ukuran maksimum body request (upload gambar/file)
    client_max_body_size 50M;

    # 1. Caching untuk file statis Next.js (file di folder ini memiliki hash unik)
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Caching untuk aset publik (WASM ONNX, model .onnx, icon, gambar)
    location ~* ^/(wasm/|.*\.onnx|.*\.onnx\.data|.*\.svg|.*\.png|.*\.ico|.*\.mp4)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # 3. Reverse Proxy Utama ke Next.js
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward header client sebenarnya ke Next.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
