# ==============================================================================
# Konfigurasi Awal Nginx (Sebelum Sertifikat SSL Dibuat)
# Gunakan file ini hanya saat pertama kali agar Nginx bisa jalan dan
# Certbot bisa melakukan verifikasi domain via HTTP port 80.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;

    # Ganti dengan domain Anda
    server_name bisara.web.id www.bisara.web.id;

    # Lokasi verifikasi domain oleh Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Teruskan sementara ke Next.js sampai SSL terbit
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
